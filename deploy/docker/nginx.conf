# HTTP entry point for private trial deployments. See docs/DEPLOYMENT_UBUNTU.md.
log_format okr_safe '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=okr_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log okr_safe;
    client_max_body_size 30m;
    add_header X-Content-Type-Options nosniff always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $okr_api http://api:8000;

    location ~ ^/(api|auth|health)(/|$) {
        proxy_pass $okr_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_cache off;
    }

    location = /auth/login {
        limit_req zone=okr_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $okr_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
