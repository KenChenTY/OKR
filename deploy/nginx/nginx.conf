# Replace paths, server_name, and certificates for the target Windows Server.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format okr '$remote_addr [$time_local] $request_method $uri '
                   '$status $body_bytes_sent $request_time $request_id';
    access_log logs/access.log okr;
    client_body_temp_path temp/client_body;
    proxy_temp_path temp/proxy;
    keepalive_timeout 30s;
    map $uri $auth_limit_key {
        default "";
        ~^/auth/(login|callback|development/login)$ $binary_remote_addr;
    }
    limit_req_zone $auth_limit_key zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    server {
        listen 80;
        server_name okr.example.com;
        return 308 https://okr.example.com$request_uri;
    }
    server {
        listen 443 ssl;
        server_name okr.example.com;
        ssl_certificate D:/OKR/config/tls/fullchain.pem;
        ssl_certificate_key D:/OKR/config/tls/private.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root D:/OKR/releases/RELEASE_ID/frontend/dist;
        index index.html;
        client_max_body_size 30m;
        limit_req zone=api_limit burst=60 nodelay;
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        add_header X-Content-Type-Options nosniff always;

        location ~ ^/(api|auth)(/|$) {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host okr.example.com;
            proxy_set_header X-Forwarded-Host okr.example.com;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Forwarded "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_cache off;
            proxy_intercept_errors off;
        }
        location /health/ {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://127.0.0.1:8000;
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
        }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header X-Content-Type-Options nosniff always;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
